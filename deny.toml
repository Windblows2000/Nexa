[graph]
all-features = true
no-default-features = false

[advisories]
ignore = []
unmaintained = "all"
yanked = "deny"

[licenses]
allow = [
    "GPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "ISC",
    "Unicode-3.0",
    "MPL-2.0",
    "BSD-3-Clause",
]
exceptions = [
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-root-certs" }
]
confidence-threshold = 0.8

[[licenses.clarify]]
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 }
]

[bans]
multiple-versions = "deny"
skip = [
    "getrandom@0.2.17",
    "getrandom@0.3.4",
    "getrandom@0.4.3",
    "r-efi@5.3.0",
    "r-efi@6.0.0",
    "syn@2.0.119",
    "syn@3.0.4",
    "thiserror@1.0.69",
    "thiserror@2.0.18",
    "thiserror-impl@1.0.69",
    "thiserror-impl@2.0.18",
    "windows-sys@0.45.0",
    "windows-sys@0.61.2",
]
wildcards = "deny"
workspace-default-features = "allow"
external-default-features = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
