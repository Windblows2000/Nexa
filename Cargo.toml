[package]
name = "nexa"
description = "A Powerful, Rust-Based CLI Linux Tool for your Media Needs."
repository = "https://github.com/Windblows2000/Nexa"
version = "1.2.1"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.0"
tokio = { version = "1.50", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time"] }
tokio-util = { version = "0.7", features = ["codec"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zbus = "5.14"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream", "http2"] }
sha2 = "0.10"
hex = "0.4"
url = "2.5"
directories = "6.0"
futures-util = { version = "0.3.32", features = ["sink", "std"] }
uuid = { version = "1.22.0", features = ["v4"] }
infer = "0.19.0"
postcard = { version = "1.1.3", features = ["use-std"] }

[[bin]]
name = "nexa"
path = "src/cli/main.rs"

[[bin]]
name = "nexad"
path = "src/daemon/main.rs"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
